<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="1000" height="310" role="img" aria-labelledby="t d"><title id="t">Sistemas que diseño: backend en Go, agentes de IA locales y EdTech con contenido verificado</title><desc id="d">Tres tarjetas con diagramas conceptuales. Backend en Go: cliente, dominio aislado y almacenamiento embebido o relacional. Agentes de IA locales: voz y visión pasan por un enrutador que elige entre regla, modelo o búsqueda en documentos. EdTech: fuentes, generación, verificación, app y web, estudiantes.</desc><defs><style>@font-face{font-family:'G5';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'G6';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'GM';src:url(data:font/woff2;base64,) format('woff2');}
.card{fill:#121419;stroke:#262A31;stroke-width:1}
.node{fill:#0D1015;stroke:#262A31;stroke-width:1}
.core{fill:#3A2318;stroke:#FF8A4C;stroke-width:1.2}
.wire{fill:none;stroke:#262A31;stroke-width:1.5;stroke-linecap:round}
.flow{fill:none;stroke:#FF8A4C;stroke-width:1.5;stroke-linecap:round;stroke-dasharray:3 9}
.dot{fill:#FF8A4C}
.track{fill:#1F232A} .bar{fill:#FF8A4C} .bar-l{fill:#5C6068}
.area{fill:#3A2318} .line{fill:none;stroke:#FF8A4C;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.grid{stroke:#1F232A;stroke-width:1}
.f-text{fill:#EDEDEF} .f-mut{fill:#9A9EA6} .f-accent{fill:#FF8A4C}
@media (prefers-reduced-motion:no-preference){
 .c{animation:in .7s cubic-bezier(0.23,1,0.32,1) both}
 .flow{animation:flow 1.6s linear infinite}
 .grow{transform-box:fill-box;transform-origin:left center;animation:grow .9s cubic-bezier(0.23,1,0.32,1) both;animation-delay:inherit}
 .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(0.23,1,0.32,1) .35s forwards}
 .fade{animation:fade .8s ease-out .6s both}
}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
